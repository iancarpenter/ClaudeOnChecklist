<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Packing Checklist</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2214%22>🎒</text></svg>" />
</head>
<body>
  <main class="page" id="top">
    <div class="status-row" aria-hidden="true">
      <span class="status-page">P100</span>
      <span class="status-service">PACKFAX 100</span>
      <span id="clock" class="status-clock"></span>
    </div>

    <header class="page-header">
      <div class="mosaic" aria-hidden="true"></div>
      <h1><span class="double-height">Packing Checklist</span></h1>
      <div class="mosaic mosaic-flip" aria-hidden="true"></div>
      <p class="subtitle">Tick items off as you pack them. Your progress is saved automatically.</p>
    </header>

    <section class="overall">
      <div class="overall-track">
        <div id="overall-fill" class="overall-fill"></div>
      </div>
      <p id="overall-label" class="overall-label">0 / 0 packed</p>
    </section>

    <div class="lists">
      <section class="list-card" data-list="rucksack" id="rucksack">
        <div class="list-card-header">
          <h2><span class="page-no">101</span> Rucksack</h2>
          <span class="count" data-count="rucksack">0 / 0</span>
        </div>
        <ul class="checklist" id="rucksack-list"></ul>
      </section>

      <section class="list-card" data-list="case" id="case">
        <div class="list-card-header">
          <h2><span class="page-no">102</span> Case</h2>
          <span class="count" data-count="case">0 / 0</span>
        </div>
        <ul class="checklist" id="case-list"></ul>
      </section>
    </div>

    <footer class="page-footer fastext">
      <button id="reset-btn" type="button" class="fx fx-red">Reset all</button>
      <a href="#rucksack" class="fx fx-green">Rucksack</a>
      <a href="#case" class="fx fx-yellow">Case</a>
      <a href="#top" class="fx fx-cyan">Top</a>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
